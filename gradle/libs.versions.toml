[versions]
commons-io = "2.6"
exposed = "0.39.2"
git-version = "0.12.2"
guava = "28.2-jre"
kord = "0.8.0-M16"
kotlin = "1.7.10"
kotlin-logging = "2.1.23"
ktor = "2.1.0"
logback = "1.2.11"
h2 = "1.4.200"
shadow = "7.1.2"

[libraries]
apache-commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kord = { module = "dev.kord:kord-core", version.ref = "kord" }
kotlin-logging = { module = "io.github.microutils:kotlin-logging", version.ref = "kotlin-logging" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

[bundles]
common = [ "kotlin-stdlib", "ktor-client-core", "ktor-client-cio", "kord" ]
exposed = [ "exposed-dao", "exposed-jdbc", "exposed-kotlin-datetime" ]

[plugins]
git-version = { id = "com.palantir.git-version", version.ref = "git-version" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
dice.help.usage=Usage: `dice [roll]`. Rolls can be separated by `,`, `;` and ' ' symbols\nDices roll constructed from tokens:\n*`N`, `M` can be any positive number*\n`NdM` - N default dices with M faces, `N`, `Nd`, `dM` are also valid\n`([dices])` - combine multiple dices in one roll, like `(2d4 4d8)`. Dices can be separated with `,` `;` or ` `\n`kN` - keep highest N rolls for try\n`tN`, `xN`, `*N` - throw dices N times\n`eN` - explode dices, max N times (0 - unlimited). `e` also valid.\n`+N`, `-N` - add roll values modifier (per each dice roll), positive or negative\nAll tokens are **optional**\n**Examples**: `2d4+5`, `(d4 4 4d 2d4)ek3-1`

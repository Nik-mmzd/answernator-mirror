dice.help.usage=Usage: `dice [roll]`.\nDice roll format: `[N][dX][+Y][xZ]` without brackets.\nAny part (in brackets) may be ommited, e.g. `2d8` or `2+5` are valid\n\n**`N`** is dices count.\n**`X`** is max pips count.\n**`Y`** is modifier (added to all throws in roll)\n**`Z`** is tries per roll.

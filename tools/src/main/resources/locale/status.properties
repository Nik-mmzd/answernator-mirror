status.help=Bot status control. Usage: `status [online/dnd/idle/invisible]` to set selected status. `status game [text-here]` will set "playing ..." status. `status randomgame` random game as "playing" status. `status randomgame [delay in mins or "stop"]` will launch status self-updating with random game name every N minutes (or stop it). `status custom [text-here]` will set custom status. `status clear` will clear the status.
status.help.description=bot status control
status.error=Error. Please consult with help command.
status.online=Status set: Online
status.dnd=Status set: Do Not Disturb
status.idle=Status set: Idle
status.invisible=Status set: Invisible
status.playing=Status set: Playing %1$s
status.playing.timed.stopped=Random games auto-status stopped
status.playing.timed.running=Random games auto-status is already running
status.playing.timed.error=Wrong random games auto-status delay. It must be at least 30
status.playing.timed.started=Random games auto-status started with delay %1$s minutes
status.clear=Status cleared
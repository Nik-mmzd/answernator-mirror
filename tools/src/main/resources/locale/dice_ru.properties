dice.help.usage=Использование: `dice [сет-дайсов]`. Сеты разделяются символами `,`, `;` и ` `\nКаждый сет конструируется из токенов:\n*`N`, `M` - любые положительные числа*\n`NdM` - N костей по M граней, `N`, `Nd`, `dM` также допустимы\n`([кости])` - скомбинировать несколько разных сетов костей в одном броске, например `(2d4 4d8)`. Сеты костей разделяются символами `,` `;` или ` `\n`kN` - оставить N самых больших выпавщих значений в броске\n`tN`, `xN`, `*N` - бросить кости N раз\n`eN` - взорвать дайсы не более N раз (0 - без ограничений). `e` также допустимо.\n`+N`, `-N` - модификатор выпавших очков. Один на весь бросок, применяется к каждой кости.\nВсе токены **опциональны**\n**Примеры**: `2d4+5`, `(d4 4 4d 2d4)ek3-1`

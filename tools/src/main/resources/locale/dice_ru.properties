dice.title=Бросок костей
dice.roll=Бросок %s$2-гранных костей: %s$1, модификатор +%s$3...
dice.error.limits=Превышены лимиты. Текущие лимиты: %s$1 костей, 2 to %s$2 граней на кости, модификатр +%s$3, %s$4 попыток на бросок, %s$5 бросков

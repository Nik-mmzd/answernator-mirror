dice.error.format=Неверный формат броска кости.

dice.help.usage=Использование: `dice [бросок]`.\nФормат броска кости: `[N][dX][+Y][xZ]` (без скобок).\nЛюбая часть (в скобках) может быть опущена, т.е. `2d8` или `2+5` тоже сработают\n\n**`N`** - количество костей.\n**`X`** - количество граней\n**`Y`** - модификатор очков\n**`Z`** - попыток в броске.
dice.help.description=Бросок костей
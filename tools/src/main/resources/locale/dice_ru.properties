dice.title=Бросок костей
dice.roll=Бросок. Граней: %2$s, костей: %1$s, модификатор +%3$s...
dice.error.limits=Превышены лимиты. Текущие лимиты: %1$s костей, от 2 до %2$s граней на кости, модификатр +%3$s, %4$s попыток на бросок, %5$s бросков
dice.error.format=Неверный формат броска кости.

dice.help.usage=Использование: `dice [бросок]`.\nФормат броска кости: `[N][dX][+Y][xZ]` (без скобок).\nЛюбая часть (в скобках) может быть опущена, т.е. `2d8` or `2+5` тоже сработают\n\n**`N`** - количество костей.\n**`X`** - количество граней\n**`Y`** - модификатор очков\n**`Z`** - попыток в броске.
dice.help.description=Бросок костей
status.help=Bot status control. Usage: `status [online/dnd/idle/invisible]` to set selected status. `status game [text-here]` will set "playing ..." status. `status randomgame` random game as "playing" status. `status custom [text-here]` will set custom status. `status clear` will clear the status.
status.done=Done. Status updated.
status.error=Error. Please consult with command help.
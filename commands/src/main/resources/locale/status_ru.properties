status.help=Управление статусом бота. Использование: `status [online/dnd/idle/invisible]` для установки соответствующего статуса. `status game [text-here]` устанавливает статус "играет в ...". `status randomgame` устанавливает случайное название игры в статус. `status custom [text-here]` устанавливает пользовательский статус. `status clear` очищает статус.
status.done=Статус обновлён.
status.error=Неизвестная команда.
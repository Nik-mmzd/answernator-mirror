status.help=Управление статусом бота. Использование: `status [online/dnd/idle/invisible]` для установки соответствующего статуса. `status game [text-here]` устанавливает статус "играет в ...". `status randomgame` устанавливает случайное название игры в статус. `status randomgame [число минут или "stop"]` запускает авто-статус случайными играми с указанной задержкой (или останавливает его). `status custom [text-here]` устанавливает пользовательский статус. `status clear` очищает статус.
status.error=Неизвестная команда.
status.online=Установлен статус: Онлайн
status.dnd=Установлен статус: Не беспокоить
status.idle=Установлен статус: Отошел
status.invisible=Установлен статус: Невидимый
status.playing=Установлен статус: Играет в %1$s
status.playing.timed.stopped=Авто-статус случайными играми отключен
status.playing.timed.running=Авто-статус случайными играми уже запущен
status.playing.timed.error=Неправильная задержка авто-статуса. Она должна быть не менее 30 минут 
status.playing.timed.started=Авто-статус случайными играми запущен с задержкой в %1$s минут
status.clear=Статус очищен
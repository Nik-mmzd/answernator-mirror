config.help.usage=Usage:\n`config get` - to show current config\n`config lang [lang]` - change bot language\n`config prefix [prefix]` - set command prefix\n`config greeting set [text]/enable/disable/channel` - greeting settings. You can use `%user%` and `%guild%` variables in greeting text\n`config defrole enable/disable/set [@role]/unset` - default role settings\n`config muterole set [@role]/unset` - mute role settings\n`config blacklist show/add [command]/remove [command]` - command blocklist settings

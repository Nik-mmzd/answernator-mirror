command.dice.help=**/dice** — roll dice.\n\n**Sets** are separated by space, `,` or `;`. Each set is built from tokens (N, M = positive integers):\n• `NdM` — N dice of M faces. `N`, `Nd`, `dM` also allowed (defaults: 1 die, 6 faces).\n• `(...)` — combine differently-faced dice in one roll, e.g. `(2d4 4d8)`.\n• `kN` — keep the N highest rolled values.\n• `eN` — explode dice up to N times (0 = unlimited). `e` alone = unlimited.\n• `tN`, `xN`, `*N` — roll the set N times.\n• `+N`, `-N` — flat modifier added to each try.\n\nEmpty input defaults to `1d6`.\n\n**Examples:** `2d4+5` · `(d4 4 4d 2d4)ek3-1` · `4d6k3x3` · `1d20; 2d6`

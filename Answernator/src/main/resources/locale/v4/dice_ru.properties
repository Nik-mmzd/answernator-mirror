command.dice.help=**/dice** — бросок костей.\n\n**Сеты** разделяются пробелом, `,` или `;`. Каждый сет строится из токенов (N, M — положительные числа):\n• `NdM` — N костей по M граней. `N`, `Nd`, `dM` тоже допустимы (по умолчанию: 1 кость, 6 граней).\n• `(...)` — скомбинировать разногранные кости в одном броске, напр. `(2d4 4d8)`.\n• `kN` — оставить N самых больших значений.\n• `eN` — взрывать кости не более N раз (0 = без ограничений). `e` без числа — без ограничений.\n• `tN`, `xN`, `*N` — бросить сет N раз.\n• `+N`, `-N` — модификатор, прибавляется к каждой попытке.\n\nПустой ввод даёт `1d6`.\n\n**Примеры:** `2d4+5` · `(d4 4 4d 2d4)ek3-1` · `4d6k3x3` · `1d20; 2d6`

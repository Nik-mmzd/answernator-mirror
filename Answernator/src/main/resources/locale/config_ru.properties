config.help=Простая команда для конфигурирования бота. Использование:\n`config get` - текущий конфиг\n`config set lang [lang]` - установить выбранный язык\n`config set greet [enabled/disabled]` - включить/выключить приветствие ботом новых пользователей\n`config set greet set текст-приветствия`, где %1$s в тексте будет заменяться на имя пользователя, а %12$s на название сервера
config.help.usage=Использование:\n`config get` - показать настройки\n`config lang [язык]` - сменить язык бота\n`config prefix [префикс]` - сменить префикс\n`config greeting set [текст]/enable/disable/channel` - настройки приветствия. В тексте приветствия можно использовать переменные `%user%` и `%guild%`\n`config defrole enable/disable/set [@role]/unset` - настройки добавления стандартной роли\n`config muterole set [@role]/unset` - настройки роли мута\n`config blacklist show/add [команда]/remove [команда]` - настройки черно списка команд
